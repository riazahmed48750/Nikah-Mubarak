<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salman & Alina Nikkah</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="main-container">
    <div class="card">
      <h1 class="names">Salman & Alina</h1>
      <p class="invite-text">You are invited to celebrate our Nikkah</p>

      <!-- Countdown Timer -->
      <div id="countdown">
        <span id="days"></span> din
        <span id="hours"></span> ghante
        <span id="minutes"></span> minute
        <span id="seconds"></span> second
      </div>

      <!-- RSVP Button -->
      <a href="#" class="rsvp-button">RSVP</a>
    </div>
  </div>

  <script src="timer.js"></script>
</body>
</html>
